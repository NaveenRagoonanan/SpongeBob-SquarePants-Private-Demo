   var msg=err&&err.message?err.message:String(err||''),stack=err&&err.stack?String(err.stack).split('\n').slice(0,4).join('\n'):'';

   b.style.cssText=full?s+'top:0;bottom:0;background:#1a0f3a;':s+'bottom:0;max-height:40%;background:rgba(120,20,60,.94);';
   var h='<b style="font-size:'+(full?'20':'15')+'px">'+esc(title)+'</b><br>'+esc(msg)+(stack?'<pre style="white-space:pre-wrap;font-size:11px;opacity:.8">'+esc(stack)+'</pre>':'');

   else h+=' <button onclick="this.parentNode.style.display=\'none\'" style="font:inherit;margin-left:8px">Dismiss</button>';
   b.innerHTML=h;b.style.display='block';
  }catch(e){}
 };
 window.addEventListener('error',function(e){
  var t=e&&e.target;
  if(t&&t!==window&&t.tagName){if(t.tagName==='SCRIPT'||t.tagName==='LINK')window.__fatal('A required file failed to load',t.src||t.href,true);return}
  window.__fatal('Something went wrong',e&&e.error?e.error:(e&&e.message)||'Unknown error',!window.__booted);
 },true);
 window.addEventListener('unhandledrejection',function(e){window.__fatal('Unexpected error',e&&e.reason,false)});
 try{var c=document.createElement('canvas');if(!(c.getContext&&c.getContext('2d')))window.__fatal('This browser cannot draw the game','HTML5 canvas is not available.',true)}catch(e){}

<script id="game">
window.addEventListener('load',function(){try{
/*GAME-START*/
const W=360,H=640,SY=590,C={top:'#3ec6ff',bot:'#06518a'};
const cv=document.getElementById('c'),g=cv.getContext('2d'),ui=document.getElementById('ui'),back=document.getElementById('back');
let S=1,OX=0,OY=0,DPR=1,mode='menu',Q=null,Qid='',T=0,last=0,AC;
const ptr={x:W/2,y:0,down:false,tap:null,m:0},parts=[];
let save={};try{save=JSON.parse(localStorage.getItem('pq')||'{}')}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a);
const bgb=Array.from({length:16},()=>({x:Math.random(),y:Math.random(),r:rnd(2,7),v:rnd(.02,.06)}));

function theme(){const s=getComputedStyle(document.documentElement);C.top=s.getPropertyValue('--top').trim()||C.top;C.bot=s.getPropertyValue('--bot').trim()||C.bot}
function fit(){DPR=Math.min(devicePixelRatio||1,3);const w=innerWidth,h=innerHeight;cv.width=w*DPR;cv.height=h*DPR;cv.style.width=w+'px';cv.style.height=h+'px';S=Math.min(w/W,h/H);OX=(w-W*S)/2;OY=(h-H*S)/2;theme()}
addEventListener('resize',fit);try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',fit)}catch(e){}fit();

const beep=(f,d=.08,v=.05,ty='square')=>{try{if(!AC)return;const o=AC.createOscillator(),a=AC.createGain();o.type=ty;o.frequency.value=f;a.gain.value=v;o.connect(a);a.connect(AC.destination);o.start();a.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};
const burst=(x,y,c,n=10)=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*120;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:.5,c})}};
function txt(s,x,y,sz=24,al='left',col='#fff'){g.font=`800 ${sz}px system-ui,sans-serif`;g.textAlign=al;g.lineWidth=5;g.lineJoin='round';g.strokeStyle='#0a3a5c';g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y)}
const hearts=n=>txt('♥'.repeat(Math.max(0,n)),W-14,44,24,'right','#ff5a6e');
function star(cx,cy,R,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r:R;g.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d)}g.closePath()}

function patrick(x,y,s,r=0){g.save();g.translate(x,y);g.rotate(r);g.scale(s,s);g.lineJoin='round';g.lineWidth=3;
 g.strokeStyle='#b84d70';g.fillStyle='#f7a8bd';star(0,0,42,20);g.fill();g.stroke();
 g.fillStyle='#37b24d';g.strokeStyle='#1f7a32';g.fillRect(-17,8,34,17);g.strokeRect(-17,8,34,17);
 g.fillStyle='#9b5de5';for(const [a,b] of [[-9,14],[5,19],[11,12]]){g.beginPath();g.arc(a,b,2.5,0,7);g.fill()}
 g.fillStyle='#fff';g.beginPath();g.arc(-7,-10,6.5,0,7);g.fill();g.beginPath();g.arc(7,-10,6.5,0,7);g.fill();
 g.fillStyle='#222';g.beginPath();g.arc(-6,-9,2.4,0,7);g.fill();g.beginPath();g.arc(8,-9,2.4,0,7);g.fill();
 g.strokeStyle='#8a2c4c';g.lineWidth=2.5;g.beginPath();g.arc(0,-6,8,.3,Math.PI-.3);g.stroke();g.restore()}
function jelly(x,y){g.fillStyle='#ff8fd8';g.strokeStyle='#ff8fd8';g.lineWidth=3;g.beginPath();g.arc(x,y,16,Math.PI,0);g.fill();
 for(let i=-10;i<=10;i+=7){g.beginPath();g.moveTo(x+i,y);g.quadraticCurveTo(x+i+Math.sin(T*8+i)*4,y+10,x+i,y+20);g.stroke()}
 g.fillStyle='#ffffffaa';g.beginPath();g.arc(x-6,y-7,3,0,7);g.fill()}
function urchin(x,y){g.strokeStyle='#3a1458';g.fillStyle='#3a1458';g.lineWidth=3;for(let i=0;i<10;i++){const a=i*.628+T;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*21,y+Math.sin(a)*21);g.stroke()}
 g.beginPath();g.arc(x,y,12,0,7);g.fill();g.fillStyle='#ff6b6b';g.fillRect(x-7,y-4,5,3);g.fillRect(x+2,y-4,5,3)}

const Qs={
jelly:{init(){Object.assign(this,{px:W/2,items:[],sp:.5,s:0,lives:3,t:0})},
 update(dt){this.t+=dt;if(ptr.down||ptr.m)this.px+=(ptr.x-this.px)*Math.min(1,dt*14);this.px=Math.max(30,Math.min(W-30,this.px));
  this.sp-=dt;if(this.sp<=0){this.sp=Math.max(.32,.85-this.t*.01);this.items.push({x:rnd(24,W-24),y:-24,v:rnd(150,200)+this.t*3,bad:Math.random()<Math.min(.5,.25+this.t*.004)})}
  for(const it of this.items){it.y+=it.v*dt;
   if(Math.abs(it.x-this.px)<40+EQ.w*80&&Math.abs(it.y-535)<32){it.dead=1;
    if(it.bad){this.lives--;beep(120,.25,.08,'sawtooth');burst(it.x,it.y,'#7a2fb0')}
    else{this.s++;beep(600+(this.s%8)*50,.08);burst(it.x,it.y,'#ff8fd8')}}
   else if(it.y>H+30)it.dead=1}
  this.items=this.items.filter(i=>!i.dead);if(this.lives<=0)end(this.s)},
 draw(){for(const it of this.items)it.bad?urchin(it.x,it.y):jelly(it.x,it.y);
  patrick(this.px,555,.9,(ptr.x-this.px)*.002);txt(this.s,W/2,44,32,'center');hearts(this.lives)}},
dash:{init(){Object.assign(this,{y:555,vy:0,j:0,o:[],sp:.8,d:0,st:0,lives:3,inv:0,t:0})},
 sc(){return Math.floor(this.d/25)+this.st*5},
 update(dt){this.t+=dt;const v=230+this.t*5;this.d+=v*dt;this.inv-=dt;
  if(ptr.tap&&this.j<2+EQ.j){this.vy=-560;this.j++;beep(500,.1,.05,'triangle')}
  this.vy+=1600*dt;this.y+=this.vy*dt;if(this.y>=555){this.y=555;this.vy=0;this.j=0}
  this.sp-=dt;if(this.sp<=0){this.sp=Math.max(.75,rnd(1,1.7)-this.t*.005);this.o.push({x:W+40,k:'r'});
   if(Math.random()<.65)this.o.push({x:W+40+rnd(90,220),k:'s',y:rnd(430,520)})}
  for(const o of this.o){o.x-=v*dt;if(o.x<-60)o.dead=1;
   if(o.k==='r'&&this.inv<=0&&Math.abs(o.x-90)<30&&this.y>532){this.lives--;this.inv=1.2;o.dead=1;beep(110,.3,.08,'sawtooth');burst(90,this.y,'#99a')}
   if(o.k==='s'&&Math.abs(o.x-90)<36&&Math.abs(o.y-this.y)<44){o.dead=1;this.st++;beep(880,.1);burst(o.x,o.y,'#ffd23f')}}
  this.o=this.o.filter(o=>!o.dead);if(this.lives<=0)end(this.sc())},
 draw(){for(const o of this.o){if(o.k==='r'){g.fillStyle='#8b8f9c';g.beginPath();g.moveTo(o.x-26,SY);g.quadraticCurveTo(o.x-22,556,o.x,556);g.quadraticCurveTo(o.x+22,556,o.x+26,SY);g.fill();g.fillStyle='#ffffff40';g.fillRect(o.x-10,566,8,4)}
   else{g.fillStyle='#ffd23f';g.strokeStyle='#c99a00';g.lineWidth=2;star(o.x,o.y,15,7);g.fill();g.stroke()}}
  if(this.inv<=0||Math.floor(T*14)%2)patrick(90,this.y,.85,Math.sin(T*16)*.1+this.vy*.0005);
  txt(this.sc(),W/2,44,32,'center');hearts(this.lives)}},
bub:{init(){Object.assign(this,{b:[],sp:.2,s:0,left:30,hop:0})},
 update(dt){this.left-=dt;this.hop=Math.max(0,this.hop-dt*4);this.sp-=dt;
  if(this.sp<=0){this.sp=rnd(.22,.45);const r=rnd(22,36),k=Math.random();this.b.push({x:rnd(r,W-r),y:H+r,r,v:rnd(80,150),ph:rnd(0,6),k:k<.12?'g':k<.32?'x':'n'})}
  for(const b of this.b){b.y-=b.v*dt;b.x+=Math.sin(T*2+b.ph)*22*dt;if(b.y<-50)b.dead=1}
  if(ptr.tap){const p=ptr.tap;for(let i=this.b.length-1;i>=0;i--){const b=this.b[i];
   if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+12+EQ.w*60){b.dead=1;this.hop=1;
    if(b.k==='x'){this.s=Math.max(0,this.s-3);beep(130,.2,.08,'sawtooth');burst(b.x,b.y,'#7a2fb0')}
    else{this.s+=b.k==='g'?5:1;beep(b.k==='g'?1000:700+Math.random()*200,.07);burst(b.x,b.y,b.k==='g'?'#ffd23f':'#bff3ff')}
    break}}}
  this.b=this.b.filter(b=>!b.dead);if(this.left<=0)end(this.s)},
 draw(){for(const b of this.b){g.save();g.translate(b.x,b.y);
   if(b.k==='x'){g.strokeStyle='#4b1d6e';g.lineWidth=3;for(let i=0;i<12;i++){const a=i*.5236;g.beginPath();g.moveTo(Math.cos(a)*b.r,Math.sin(a)*b.r);g.lineTo(Math.cos(a)*(b.r+9),Math.sin(a)*(b.r+9));g.stroke()}}
   g.fillStyle=b.k==='g'?'#ffd23fcc':b.k==='x'?'#5a2a82cc':'#ffffff33';g.strokeStyle=b.k==='g'?'#fff3b0':'#ffffffcc';g.lineWidth=3;
   g.beginPath();g.arc(0,0,b.r,0,7);g.fill();g.stroke();g.fillStyle='#ffffffaa';g.beginPath();g.arc(-b.r*.35,-b.r*.35,b.r*.18,0,7);g.fill();g.restore()}
  patrick(W/2,555-Math.sin(this.hop*3.14)*30,.9,0);txt(this.s,W/2,44,32,'center');txt(Math.ceil(Math.max(0,this.left))+'s',W-14,44,24,'right')}}
};

const QS=[['jelly','🌸','Jellyfish Fields','Drag to catch jellies. Dodge the urchins!'],['dash','🏃','Rock Dash','Tap to jump (twice!). Grab the gold stars.'],['bub','🫧','Bubble Pop','Pop bubbles for 30 seconds. Skip the spiky ones!']];
function menu(){mode='menu';back.classList.remove('on');ui.style.display='flex';
 ui.innerHTML='<h1>Patrick’s<br><span>Side Quests</span></h1><p>Pick an adventure!</p>'+QS.map(q=>`<button class="card" data-q="${q[0]}"><b>${q[1]} ${q[2]}</b><small>${q[3]}</small><i>Best: ${save[q[0]]||0}</i></button>`).join('')+'<p style="font-size:12px;opacity:.7">Fan-made prototype · best in portrait</p>'}
function start(id){Qid=id;Q=Qs[id];Q.init();parts.length=0;ptr.tap=null;ptr.down=false;mode='play';ui.style.display='none';back.classList.add('on')}
function end(s){mode='over';const old=save[Qid]||0,nb=s>old;if(nb){save[Qid]=s;try{localStorage.setItem('pq',JSON.stringify(save))}catch(e){}}
 back.classList.remove('on');ui.style.display='flex';
 ui.innerHTML=`<h1>${nb?'New best!':'Nice run!'}</h1><p style="font-size:44px;font-weight:800">${s}</p><p>${QS.find(q=>q[0]===Qid)[2]} · Best ${Math.max(s,old)}</p><button class="card" data-q="${Qid}"><b>↻ Play again</b></button><button class="card" data-a="menu"><b>☰ All quests</b></button>`}
ui.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.q)start(b.dataset.q);else if(b.dataset.a==='menu')menu()});
back.addEventListener('click',menu);

const pt=e=>({x:(e.clientX-OX)/S,y:(e.clientY-OY)/S});
cv.addEventListener('pointerdown',e=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(_){}const p=pt(e);ptr.x=p.x;ptr.y=p.y;ptr.down=true;ptr.tap=p});
cv.addEventListener('pointermove',e=>{const p=pt(e);ptr.x=p.x;ptr.y=p.y;if(e.pointerType==='mouse')ptr.m=1});
addEventListener('pointerup',()=>{ptr.down=false});addEventListener('pointercancel',()=>{ptr.down=false});
document.addEventListener('touchmove',e=>{if(!ui.contains(e.target))e.preventDefault()},{passive:false});
ui.addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(_){}});

function bg(dt){const w=innerWidth,h=innerHeight;g.setTransform(DPR,0,0,DPR,0,0);
 const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,C.top);gr.addColorStop(1,C.bot);g.fillStyle=gr;g.fillRect(0,0,w,h);
 g.fillStyle='#ffffff14';for(let i=0;i<4;i++){const x=w*(.15+i*.25)+Math.sin(T*.4+i)*30;g.beginPath();g.moveTo(x-20,0);g.lineTo(x+20,0);g.lineTo(x+90,h);g.lineTo(x-60,h);g.fill()}
 g.fillStyle='#ffffff30';for(const b of bgb){b.y-=b.v*dt;if(b.y<-.05){b.y=1.05;b.x=Math.random()}g.beginPath();g.arc(b.x*w,b.y*h,b.r,0,7);g.fill()}
 const sy=OY+SY*S;g.fillStyle='#e8cf8a';g.fillRect(0,sy,w,Math.max(0,h-sy));g.fillStyle='#d1b36c';g.fillRect(0,sy,w,6)}

function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
 bg(dt);g.setTransform(S*DPR,0,0,S*DPR,OX*DPR,OY*DPR);
 if(mode==='play')Q.update(dt);
 if(mode!=='menu'&&Q)Q.draw();else if(mode==='locker')patrick(W/2,170,1.8,Math.sin(T*2)*.05);else patrick(W/2,555,1.3,Math.sin(T*3)*.08);
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}
 for(let i=parts.length;i--;)if(parts[i].l<=0)parts.splice(i,1);
